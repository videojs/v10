[build]
  command = "pnpm exec vp run --no-cache site#build"
  publish = "site/dist"

# PostHog reverse proxy (ad-blocker bypass)
[[redirects]]
  from = "/ph/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ph/*"
  to = "https://us.i.posthog.com/:splat"
  host = "us.i.posthog.com"
  status = 200
  force = true

# The Video.js 8 embed snippet links to this URL from millions of pages.
# Serve the page on the exact legacy URL rather than bouncing through the
# alias redirect below. Listed first because Netlify takes the first match.
[[redirects]]
  from = "https://videojs.com/html5-video-support"
  to = "/html5-video-support"
  status = 200
  force = true

# Netlify aliases -> videojs.org
[[redirects]]
  from = "https://videojs.com/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.videojs.com/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://v10.videojs.org/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://vjs10-site.netlify.app/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true


# Previous Video.js 10 builds linked directly to these legacy diagnostic URLs.
[[redirects]]
  from = "/errors"
  to = "/docs/reference/api/legacy-errors"
  status = 301

[[redirects]]
  from = "/errors/legacy-init"
  to = "/docs/reference/api/v8-legacy-init"
  status = 301

[[redirects]]
  from = "/errors/legacy-plugin"
  to = "/docs/reference/api/v8-legacy-plugin"
  status = 301

[[redirects]]
  from = "/errors/legacy-component"
  to = "/docs/reference/api/v8-legacy-component"
  status = 301

[[redirects]]
  from = "/errors/legacy-get-player"
  to = "/docs/reference/api/v8-legacy-get-player"
  status = 301

[[redirects]]
  from = "/errors/legacy-options"
  to = "/docs/reference/api/v8-legacy-options"
  status = 301

