[build]
  command = "pnpm exec vp run --no-cache site#build"
  publish = "site/dist"

# PostHog reverse proxy (ad-blocker bypass)
[[redirects]]
  from = "/ph/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  host = "us-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/ph/*"
  to = "https://us.i.posthog.com/:splat"
  host = "us.i.posthog.com"
  status = 200
  force = true

# Netlify aliases -> videojs.org
[[redirects]]
  from = "https://videojs.com/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.videojs.com/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://v10.videojs.org/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://vjs10-site.netlify.app/*"
  to   = "https://videojs.org/:splat"
  status = 301
  force = true


# Docs sections were renamed: how-to → guides; reference pages now live under reference/components and reference/api.
# Keep every old URL (and its .md twin) alive.
# The authoring guides moved to writing-style/ before the wildcards below existed; name them so they do not fall
# through to guides/ or components/. They are dev-only pages, so production answers 404 at the right address.
[[redirects]]
  from = "/docs/framework/:framework/how-to/write-guides"
  to = "/docs/framework/:framework/writing-style/write-guides"
  status = 301

[[redirects]]
  from = "/docs/framework/:framework/how-to/write-guides.md"
  to = "/docs/framework/:framework/writing-style/write-guides.md"
  status = 301

[[redirects]]
  from = "/docs/framework/:framework/reference/write-references"
  to = "/docs/framework/:framework/writing-style/write-references"
  status = 301

[[redirects]]
  from = "/docs/framework/:framework/reference/write-references.md"
  to = "/docs/framework/:framework/writing-style/write-references.md"
  status = 301

[[redirects]]
  from = "/docs/framework/:framework/how-to/*"
  to = "/docs/framework/:framework/guides/:splat"
  status = 301

# Missing pages under the new prefixes must 404 here; otherwise the hop below would bounce them between
# reference/ and components/ forever. Existing files are served before either rule applies.
[[redirects]]
  from = "/docs/framework/:framework/reference/components/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/docs/framework/:framework/reference/api/*"
  to = "/404.html"
  status = 404

# Pre-rename reference URLs hop through components/, whose rules below send each page to its new home.
[[redirects]]
  from = "/docs/framework/:framework/reference/*"
  to = "/docs/framework/:framework/components/:splat"
  status = 301

# Non-component API pages moved from components/ to api/.
