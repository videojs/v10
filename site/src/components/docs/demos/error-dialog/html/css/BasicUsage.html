<video-player class="html-error-dialog-basic">
    <media-container class="html-error-dialog-basic__container">
        <video
            class="html-error-dialog-basic__video"
            src="{{VJS10_DEMO_VIDEO_MP4}}"
            autoplay
            muted
            playsinline
            loop
        ></video>
        <button class="html-error-dialog-basic__trigger" type="button">
            Trigger a playback error
        </button>
        <media-error-dialog class="html-error-dialog-basic__dialog" tabindex="-1">
            <media-alert-dialog-title class="html-error-dialog-basic__title"></media-alert-dialog-title>
            <media-alert-dialog-description class="html-error-dialog-basic__description"></media-alert-dialog-description>
            <media-alert-dialog-close class="html-error-dialog-basic__close"></media-alert-dialog-close>
        </media-error-dialog>
    </media-container>
</video-player>
