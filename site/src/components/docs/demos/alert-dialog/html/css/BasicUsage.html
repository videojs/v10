<div class="html-alert-dialog-basic">
    <button class="html-alert-dialog-basic__trigger" type="button">
        Open alert dialog
    </button>
    <media-alert-dialog class="html-alert-dialog-basic__dialog" tabindex="-1">
        <media-alert-dialog-title class="html-alert-dialog-basic__title">
            Stop playback?
        </media-alert-dialog-title>
        <media-alert-dialog-description class="html-alert-dialog-basic__description">
            Your current playback position will be lost.
        </media-alert-dialog-description>
        <media-alert-dialog-close class="html-alert-dialog-basic__close">
            Continue
        </media-alert-dialog-close>
    </media-alert-dialog>
</div>
