[build]
  command = "pnpm exec vp run --no-cache @videojs/skins#build:shadcn"
  publish = "packages/skins/dist/shadcn"
  # Netlify only watches this package by default, but the registry renders from other workspace packages and root
  # config too. A missing cached ref makes git fail, which builds.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- ':(top)packages' ':(top)build' ':(top)package.json' ':(top)pnpm-lock.yaml' ':(top)pnpm-workspace.yaml' ':(top)tsconfig.base.json' ':(top)vite.config.ts'"

[context.production]
  command = "pnpm exec vp run --no-cache @videojs/e2e#test:registry:published"
