<media-controls class="media-video-controls media-skin media-theme-default">
  <media-tooltip-group>
    <media-controls-group class="media-controls-group-primary">
      <media-play-button class="media-button-play">
        <media-icon class="media-button-icon-restart" name="restart"></media-icon>
        <media-icon class="media-button-icon-play" name="play"></media-icon>
        <media-icon class="media-button-icon-pause" name="pause"></media-icon>
      </media-play-button>
      <media-tooltip class="media-tooltip-popup">
        <media-tooltip-label></media-tooltip-label>
        <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
      </media-tooltip>
      <media-seek-button class="media-button-seek" seconds="-10">
        <media-icon class="media-button-icon-seek-backward" name="seek"></media-icon>
        <span class="media-seek-label">10</span>
      </media-seek-button>
      <media-tooltip class="media-tooltip-popup">
        <media-tooltip-label></media-tooltip-label>
        <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
      </media-tooltip>
      <media-seek-button class="media-button-seek" seconds="10">
        <media-icon class="media-button-icon-seek-forward" name="seek"></media-icon>
        <span class="media-seek-label">10</span>
      </media-seek-button>
      <media-tooltip class="media-tooltip-popup">
        <media-tooltip-label></media-tooltip-label>
        <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
      </media-tooltip>
    </media-controls-group>
    <media-controls-group class="media-controls-group-time">
      <media-time class="media-time" type="current"></media-time>
      <media-time-slider class="media-slider-root" thumb-alignment="edge">
        <media-slider-track class="media-slider-track">
          <media-slider-fill class="media-slider-fill"></media-slider-fill>
          <media-slider-buffer class="media-slider-buffer"></media-slider-buffer>
        </media-slider-track>
        <media-slider-thumb class="media-slider-thumb"></media-slider-thumb>
        <div class="media-thumbnail-root">
          <media-slider-thumbnail class="media-thumbnail-image"></media-slider-thumbnail>
          <media-slider-value class="media-slider-value" type="pointer"></media-slider-value>
          <media-icon class="media-spinner-icon" name="spinner"></media-icon>
        </div>
        <media-slider-preview class="media-slider-preview">
          <media-slider-value class="media-slider-value" type="pointer"></media-slider-value>
        </media-slider-preview>
      </media-time-slider>
      <media-time class="media-time" type="remaining" toggle></media-time>
    </media-controls-group>
    <media-controls-group class="media-controls-group-primary">
      <media-mute-button class="media-button-mute">
        <media-icon class="media-button-icon-volume-off" name="volume-off"></media-icon>
        <media-icon class="media-button-icon-volume-low" name="volume-low"></media-icon>
        <media-icon class="media-button-icon-volume-high" name="volume-high"></media-icon>
      </media-mute-button>
      <media-popover open-on-hover delay="200" close-delay="100" side="top" class="media-volume-popover">
        <media-volume-slider class="media-slider-root" thumb-alignment="edge" orientation="vertical">
          <media-slider-track class="media-slider-track">
            <media-slider-fill class="media-slider-fill"></media-slider-fill>
          </media-slider-track>
          <media-slider-thumb class="media-slider-thumb"></media-slider-thumb>
        </media-volume-slider>
      </media-popover>
      <media-fullscreen-button class="media-button-fullscreen">
        <media-icon class="media-button-icon-fullscreen-enter" name="fullscreen-enter"></media-icon>
        <media-icon class="media-button-icon-fullscreen-exit" name="fullscreen-exit"></media-icon>
      </media-fullscreen-button>
      <media-tooltip class="media-tooltip-popup">
        <media-tooltip-label></media-tooltip-label>
        <media-tooltip-shortcut class="media-tooltip-shortcut"></media-tooltip-shortcut>
      </media-tooltip>
    </media-controls-group>
  </media-tooltip-group>
</media-controls>
