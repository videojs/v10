<media-container class="media-skin ps-sutro-audio" data-theme="sutro-audio" data-preset="audio">
  <slot></slot>

  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
  <media-hotkey keys="ArrowRight" action="seekStep" value="10"></media-hotkey>
  <media-hotkey keys="ArrowLeft" action="seekStep" value="-10"></media-hotkey>

  <svg class="ps-bg1" class="bg-shape1" viewBox="0 0 193 115">
    <path
      fill="#fff"
      d="M50.117 51.13c-40.5-6.5-28 13.5-44 30.5-32.5 51.5 75 32.001 77 13.5 2-18.5 45-19.5 86-3.5 41 16.001 16.5-21 12.5-68s-37-14.5-66.5 16.5-24.5 17.5-65 11Z"
    />
  </svg>
  <svg class="ps-bg2" class="bg-shape2" viewBox="0 0 178 138">
    <path
      fill="#fff"
      d="M26.386 103.374C-14.708 79.891-.175 60.583 18.869 34.491c43.6-58.446 66.15-36.529 139.819 20.352 73.668 56.88-88.202 102.802-73.668 74.623 14.533-28.18-17.54-2.61-58.634-26.092Z"
    />
  </svg>

  <div class="ps-controls">
    <div class="ps-info">
      <div class="ps-info-poster">
        <slot name="poster"></slot>
        <div class="ps-poster-gradient"></div>
      </div>
      <div class="ps-info-text">
        <!--
          media-chrome read `mediatitle` and `mediabyline` as template expressions. v10 skins are static, so these
          become slots the page fills — the same shape the packaged skins use for a replaceable poster.
        -->
        <h1 class="ps-title"><slot name="title"></slot></h1>
        <h2 class="ps-byline"><slot name="byline"></slot></h2>
      </div>
    </div>

    <div class="ps-bar">
      <media-playback-rate-button class="ps-button ps-rate"></media-playback-rate-button>
      <media-seek-button class="ps-button" seconds="-10"
        ><svg class="ps-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32">
          <path d="m10 13 3-3" />
          <path
            stroke="none"
            fill="currentColor"
            d="m11.88 16.08-.95 5.793H9.72l.76-4.631h-.033L9 18.074l.179-1.087 1.564-.908h1.137ZM14.12 22c-.48 0-.874-.119-1.18-.356-.308-.24-.518-.585-.63-1.036-.11-.45-.112-.993-.008-1.626.106-.632.288-1.17.545-1.616.259-.445.58-.783.96-1.015A2.441 2.441 0 0 1 15.101 16c.477 0 .87.117 1.177.35.307.235.517.573.631 1.016.116.444.121.982.017 1.616-.104.635-.286 1.178-.545 1.629-.259.449-.58.793-.964 1.033a2.412 2.412 0 0 1-1.296.356Zm.168-1.016c.33 0 .619-.167.867-.5.247-.334.426-.835.536-1.502.072-.438.088-.803.047-1.095-.039-.294-.127-.515-.265-.662a.698.698 0 0 0-.534-.22c-.325 0-.614.165-.866.497-.25.33-.428.823-.536 1.48-.073.445-.089.816-.048 1.114.041.296.13.519.269.668.138.147.314.22.53.22Z"
          />
          <path d="M19.277 22h2.017c.39 0 .706-.432.706-.964v-7.072c0-.532-.316-.964-.706-.964H10" /></svg
      ></media-seek-button>
      <media-play-button class="ps-button"
        ><svg class="ps-icon" viewBox="0 0 32 32">
          <g>
            <path
              id="icon-play"
              d="M20.7131 14.6976C21.7208 15.2735 21.7208 16.7265 20.7131 17.3024L12.7442 21.856C11.7442 22.4274 10.5 21.7054 10.5 20.5536L10.5 11.4464C10.5 10.2946 11.7442 9.57257 12.7442 10.144L20.7131 14.6976Z"
            />
          </g>
          <g id="icon-pause">
            <rect id="pause-left" x="10.5" width="1em" y="10.5" height="11" rx="0.5" />
            <rect id="pause-right" x="17.5" width="1em" y="10.5" height="11" rx="0.5" />
          </g></svg
      ></media-play-button>
      <media-seek-button class="ps-button" seconds="10"
        ><svg class="ps-icon" viewBox="0 0 32 32">
          <path d="m22 13-3-3" />
          <path
            stroke="none"
            fill="currentColor"
            d="m17.88 16.08-.95 5.793h-1.21l.76-4.631h-.033L15 18.074l.179-1.087 1.564-.908h1.137ZM20.12 22c-.48 0-.874-.119-1.18-.356-.308-.24-.518-.585-.63-1.036-.11-.45-.112-.993-.008-1.626.106-.632.288-1.17.545-1.616.259-.445.58-.783.96-1.015A2.441 2.441 0 0 1 21.101 16c.477 0 .87.117 1.177.35.307.235.517.573.631 1.016.116.444.121.982.017 1.616-.104.635-.286 1.178-.545 1.629-.259.449-.58.793-.964 1.033a2.412 2.412 0 0 1-1.296.356Zm.168-1.016c.33 0 .619-.167.866-.5.248-.334.427-.835.537-1.502.073-.438.088-.803.047-1.095-.039-.294-.127-.515-.265-.662a.698.698 0 0 0-.534-.22c-.326 0-.614.165-.866.497-.25.33-.428.823-.536 1.48-.073.445-.088.816-.048 1.114.041.296.13.519.269.668.137.147.314.22.53.22Z"
          />
          <path d="M12.723 22h-2.017c-.39 0-.706-.432-.706-.964v-7.072c0-.532.316-.964.706-.964H22" /></svg
      ></media-seek-button>
      <media-mute-button class="ps-button"
        ><svg class="ps-icon" viewBox="0 0 32 32">
          <g id="vol-paths">
            <path
              id="speaker-path"
              d="M16.5 20.486v-8.972c0-1.537-2.037-2.08-2.802-.745l-1.026 1.79a2.5 2.5 0 0 1-.8.85l-1.194.78A1.5 1.5 0 0 0 10 15.446v1.11c0 .506.255.978.678 1.255l1.194.782a2.5 2.5 0 0 1 .8.849l1.026 1.79c.765 1.334 2.802.792 2.802-.745Z"
            />
            <path
              id="vol-low-path"
              class="vol-path"
              d="M18.5 18C19.6046 18 20.5 17.1046 20.5 16C20.5 14.8954 19.6046 14 18.5 14"
            />
            <path
              id="vol-high-path"
              class="vol-path"
              d="M18 21C20.7614 21 23 18.7614 23 16C23 13.2386 20.7614 11 18 11"
            />
            <path id="muted-path-1" class="muted-path" d="M23 18L19 14" />
            <path id="muted-path-2" class="muted-path" d="M23 14L19 18" />
          </g></svg
      ></media-mute-button>
    </div>

    <div class="ps-times">
      <media-time class="ps-time-display" type="current"></media-time>
      <media-time-slider class="ps-small-range">
        <media-slider-track class="ps-track">
          <media-slider-buffer class="ps-buffer"></media-slider-buffer>
          <media-slider-fill class="ps-fill"></media-slider-fill>
        </media-slider-track>
        <media-slider-thumb class="ps-thumb"></media-slider-thumb>
      </media-time-slider>
      <media-time class="ps-time-display" type="duration"></media-time>
    </div>
  </div>

  <media-time-slider class="ps-big-range">
    <media-slider-track class="ps-track">
      <media-slider-buffer class="ps-buffer"></media-slider-buffer>
      <media-slider-fill class="ps-fill"></media-slider-fill>
    </media-slider-track>
    <media-slider-thumb class="ps-thumb"></media-slider-thumb>
    <media-slider-preview class="ps-preview" overflow="clamp">
      <media-slider-value class="ps-preview-time" type="pointer"></media-slider-value>
    </media-slider-preview>
  </media-time-slider>
</media-container>
