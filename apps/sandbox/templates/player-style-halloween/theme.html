<media-container class="media-skin ps-halloween" data-theme="halloween" data-preset="video">
  <slot></slot>

  <media-poster class="ps-poster">
    <img alt="" decoding="async" />
  </media-poster>

  <media-gesture type="tap" action="togglePaused" pointer="mouse"></media-gesture>
  <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
  <media-hotkey keys="k" action="togglePaused"></media-hotkey>
  <media-hotkey keys="m" action="toggleMuted"></media-hotkey>

  <media-error-dialog class="ps-dialog">
    <media-dialog-backdrop class="ps-dialog-backdrop"></media-dialog-backdrop>
    <media-dialog-popup class="ps-dialog-popup">
      <media-dialog-title class="ps-dialog-title"></media-dialog-title>
      <media-dialog-description class="ps-dialog-description"></media-dialog-description>
      <media-dialog-close class="ps-dialog-close">Dismiss</media-dialog-close>
    </media-dialog-popup>
  </media-error-dialog>

  <div class="ps-center">
    <media-play-button class="ps-play">

        </g>
      </svg>
    </media-play-button>
  </div>

  <div class="ps-bar">
    <!--
      One slider, not two. The original stacks a second `media-time-range` because media-chrome's thumb lives in a
      shadow root and cannot be animated from the theme; v10's thumb is a real element, so the duplicate goes away.
    -->
    <media-time-slider class="ps-range">
      <media-slider-track class="ps-web">
        <media-slider-buffer class="ps-buffered"></media-slider-buffer>
        <media-slider-fill class="ps-progress"></media-slider-fill>
      </media-slider-track>
      <media-slider-thumb class="ps-spider"></media-slider-thumb>
      <media-slider-preview class="ps-preview" overflow="clamp">
        <media-slider-thumbnail class="ps-thumbnail"></media-slider-thumbnail>
        <media-slider-value class="ps-preview-time" type="pointer"></media-slider-value>
      </media-slider-preview>
    </media-time-slider>

    <div class="ps-volume">
      <!--
        A state carrier, not a control. The candle's colour comes from the volume level, and v10 reports that only on
        `media-mute-button` — which this theme does not otherwise have.
      -->
      <media-mute-button class="ps-volume-state" tabindex="-1" aria-hidden="true"></media-mute-button>
      <div class="ps-volume-inner">
        <media-volume-slider class="ps-vslider">
          <media-slider-track class="ps-vtrack">
            <media-slider-fill class="ps-vfill"></media-slider-fill>
          </media-slider-track>
          <media-slider-thumb class="ps-flame"></media-slider-thumb>
        </media-volume-slider>
      </div>
    </div>
  </div>
</media-container>
