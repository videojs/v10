name: Codex Smoke Test

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 't3code/audit-ci-agent-models'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-5.6-sol, gpt-5.6-terra]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Smoke test ${{ matrix.model }}
        id: codex
        uses: openai/codex-action@v1
        with:
          allow-users: '*'
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ matrix.model }}
          effort: low
          sandbox: read-only
          safety-strategy: drop-sudo
          prompt: |
            This is an authentication and model-access smoke test.
            Do not inspect repository files or use tools.
            Reply with exactly: CODEX_SMOKE_OK

      - name: Verify response
        env:
          CODEX_OUTPUT: ${{ steps.codex.outputs.final-message }}
        run: |
          if [[ "$CODEX_OUTPUT" != *"CODEX_SMOKE_OK"* ]]; then
            echo "Codex did not return the expected smoke-test response."
            exit 1
          fi
