name: Deployment

concurrency: production

on:
  push:
    branches:
      - main
  # Recovery hatch: release-please recomputes each package's commit range from its
  # latest release, so a missing tag makes that package replay old commits into the
  # next release PR. Dispatching re-runs the calculation once the tag is restored,
  # without needing an unrelated commit on main to trigger it. release-please
  # detects the target branch from the repository default, so no ref input is
  # needed here.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use a fine grained token for release-please so this workflow
          # can trigger other workflows like release-pr.yml
          # see https://github.com/peter-evans/create-pull-request/issues/48
          token: ${{ secrets.V10_WORKFLOW_TRIGGER_WORKFLOW_GH_TOKEN }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

      - uses: actions/checkout@v5
        # these if statements ensure that a publication only occurs when
        # a new release is created:
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Setup pnpm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm i --frozen-lockfile

      - name: Restore Vite Task cache
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-restore-only-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-packages-

      - name: Clean
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm clean

      - name: Build
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm build:packages

      - name: Build CDN bundles
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm build:cdn

      # Fail before publishing rather than ship bundles that reach out to a public
      # CDN at runtime, which would break self-hosted and archive installs.
      - name: Check CDN bundles are self-contained
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm -F @videojs/html check:cdn

      - name: Build distribution archive
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm -F @videojs/html build:archive

      # The site build emits per-framework markdown to site/dist/docs/framework/{html,react}/.
      # The @videojs/html and @videojs/react packages' prepack scripts (fired by `pnpm publish`
      # below) copy that subtree into each package's docs/ directory so it ships in the tarball.
      # The site task and CLI dependency graph let Vite Task reuse the package builds here.
      - name: Build site (required by html/react prepack and CLI)
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm build:site

      - name: Build CLI
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm build:cli

      - name: Publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: pnpm --fail-if-no-match -r publish --filter "./packages/*" --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Attach the archive to the @videojs/html release so installers outside npm
      # (Composer, Drupal) have a stable, versioned download. The version comes from
      # the manifest release-please just bumped, matching release-pr.yml.
      - name: Upload distribution archive to the release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          VERSION=$(jq -r '."packages/html"' .github/release-please/.release-please-manifest.json)
          gh release upload "@videojs/html@${VERSION}" \
            "packages/html/archive/videojs-html-${VERSION}.zip" \
            "packages/html/archive/videojs-html-${VERSION}.tar.gz" \
            packages/html/archive/SHA256SUMS \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update site/v10 branch
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: git push origin HEAD:refs/heads/site/v10 --force
