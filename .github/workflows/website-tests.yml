name: Website Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Cache Vite Task setup
        uses: actions/cache@v5
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-

      - name: Run website tests
        run: pnpm exec vp run --filter="site^..." build && pnpm exec vp run site#test

  astro-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Cache Vite Task build setup
        uses: actions/cache@v5
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-

      - name: Build packages
        run: pnpm build:packages

      - name: Generate site content
        run: pnpm exec vp run site#api-docs:generate && pnpm exec vp run site#ejected-skins

      - name: Astro check
        run: cd site && pnpm astro check --minimumSeverity warning
