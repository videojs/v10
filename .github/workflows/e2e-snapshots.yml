name: E2E Snapshots

# Records visual baselines in the same container the E2E workflow runs in, so they match what CI compares against.
# Download the artifact, copy the `*-snapshots` directories into place, and commit them.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: Test file filter passed to Playwright, for example `visual` or `skin-layouts`
        default: visual
        type: string
      browsers:
        description: Player projects to record, comma separated
        default: chromium,webkit
        type: string

jobs:
  snapshots:
    name: Record snapshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Vite Task cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-snapshots-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-e2e-
            vite-task-${{ runner.os }}-${{ runner.arch }}-packages-

      - name: Build packages and pages
        run: pnpm build:packages && pnpm build:cdn && pnpm exec vp run '@videojs/e2e#prepare:player'

      - name: Record player snapshots
        working-directory: apps/e2e
        run: |
          projects=()
          IFS=',' read -ra browsers <<<"${{ inputs.browsers }}"
          for browser in "${browsers[@]}"; do projects+=(--project="vite-${browser// /}"); done
          pnpm exec playwright test --config suites/player/playwright.config.ts "${{ inputs.spec }}" --update-snapshots "${projects[@]}"

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshots
          path: apps/e2e/suites/player/tests/**/*-snapshots/
          retention-days: 7
